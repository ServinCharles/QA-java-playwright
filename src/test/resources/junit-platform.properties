# Parallel execution.
# Test classes run side by side. Tests inside one class run in order, on one thread.
# That is the safe level for Playwright for Java, which is not thread-safe: each UI test
# class owns its own Playwright and browser (see BaseUiTest) and nothing is shared.
#
# To switch parallel runs off for one run:
#   mvn test -Djunit.jupiter.execution.parallel.enabled=false
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=same_thread
junit.jupiter.execution.parallel.mode.classes.default=concurrent
