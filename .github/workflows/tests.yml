name: Tests

# Runs the API and UI tests on every commit pushed to any branch, on every
# pull request, and on demand from the Actions tab ("Run workflow").
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer commit on the same branch cancels the run for the older one.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: API and UI tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Install the Playwright browser
        run: mvn -B exec:java -e -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps chromium"

      # GitHub sets CI=true, so the HTML report is written but no browser is opened.
      - name: Run the API and UI tests
        run: mvn -B test

      # Runs even when tests fail, so the evidence is always available.
      - name: Upload the test report and failure evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-report
          path: |
            target/test-report/
            target/failures/
            target/traces/
            target/surefire-reports/
          if-no-files-found: warn
          retention-days: 14
